[build-system]
requires = ["setuptools>=61"]
# Staging of the kernel sources into mudnn/data/ happens in build_backend.py;
# see that file for why the sources stay in their own top-level directories.
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "mudnn-frontend"
description = "cuDNN-frontend-compatible builders for muDNN backend graph descriptors"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

[tool.setuptools]
package-dir = {"" = "python", "include" = "include"}
# build_backend.py is not a package module: `backend-path = ["."]` above is what
# makes it importable during the build, and listing it here would look for it
# under python/ and ship a stray top-level name.

[tool.setuptools.packages.find]
# ``include`` is the C++ header tree at the repository root.  It is declared a
# namespace package so the wheel carries it the way cuDNN Frontend does: a
# top-level ``include/`` next to the Python packages, usable straight from the
# install prefix (``-I<site-packages>``).  The include list also keeps the scan
# off muDNN/, kernels/ and 3rdparty/: those are JIT sources, not packages.
where = ["python", "."]
include = ["mudnn*", "mudnn_frontend*", "cudnn_frontend*", "include"]
namespaces = true

[tool.setuptools.dynamic]
# One version, in python/mudnn_frontend/_version.py -- the same shape cuDNN
# Frontend uses (`version = {attr = "cudnn.__version__"}`), so a release bump is
# not a hunt through pyproject.toml, the Python package and the docs.
version = {attr = "mudnn_frontend._version.__version__"}

[tool.setuptools.package-data]
# The JIT compiles kernel sources at runtime, so the staged tree has to travel
# with the wheel. Everything under mudnn/data is generated by build_backend.py.
"mudnn.data" = ["**/*"]
# Headers, mirroring cuDNN Frontend's wheel layout.
include = ["**/*"]

[project.optional-dependencies]
# Runtime JIT for MUSA C++/mutlass kernels (``mudnn._jit``): compiles kernel
# sources with mcc through ninja and loads them with tvm_ffi.
#
# ``apache-tvm-ffi`` has no public PyPI release for MUSA; install the vendor
# wheel (e.g. apache_tvm_ffi-*.whl) alongside this extra. A MUSA SDK providing
# ``mcc`` >= 5.1.0 is required at runtime, not as a Python dependency.
jit = ["apache-tvm-ffi", "jinja2", "packaging", "ninja"]

[dependency-groups]
# ``looseversion`` used to be vendored as ``python/looseversion`` and shipped as
# an extra top-level package in the wheel.  It is only a test helper (see
# ``tests/python/common/frontend_legacy.py``), and shipping it let this package
# shadow a real install of it, so it is a dev dependency now -- the same place
# cuDNN Frontend keeps it.
dev = ["looseversion", "pytest"]

[tool.pytest.ini_options]
markers = [
    "L0: standard upstream correctness coverage",
    "L1: upstream long-sequence coverage",
    "gpu_exclusive: requires an otherwise idle GPU",
    "xdist_group(name): upstream tests that share exclusive GPU resources",
]
